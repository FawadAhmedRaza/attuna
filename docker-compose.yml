services:
  postgres:
    image: postgres:16-alpine
    container_name: attuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attuna
      POSTGRES_PASSWORD: attuna
      POSTGRES_DB: attuna_dev
    ports:
      - "5432:5432"
    volumes:
      - attuna_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attuna -d attuna_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attuna_pgdata:
